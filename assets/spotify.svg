<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0d14"/>
      <stop offset="100%" stop-color="#08070b"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="20" y1="65" x2="780" y2="65" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <text x="40" y="48" font-family="'Space Mono', monospace" font-size="11" fill="#f59e0b" letter-spacing="2">FIG. 05 // SPOTIFY WEB PLAYER CLIENT • FREQUENCY SPECTRUM</text>
  <text x="610" y="48" font-family="'Space Mono', monospace" font-size="10" fill="#6f6b7e">HTML5 AUDIO • CSS GRID</text>

  <!-- Audio Spectrum Analyzer Bars -->
  <g transform="translate(60, 110)">
    <rect width="680" height="170" rx="4" fill="rgba(18,17,24,0.75)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="28" font-family="'Space Mono', monospace" font-size="10" fill="#6f6b7e">FAST FOURIER TRANSFORM (FFT) REAL-TIME FREQUENCY VISUALIZER [60Hz – 16kHz]</text>

    <!-- 28 Dynamic Spectrum Bars -->
    <g transform="translate(30, 50)">
      <rect x="0" y="65" width="14" height="45" rx="2" fill="url(#barGrad)"/>
      <rect x="22" y="40" width="14" height="70" rx="2" fill="url(#barGrad)"/>
      <rect x="44" y="20" width="14" height="90" rx="2" fill="url(#barGrad)"/>
      <rect x="66" y="10" width="14" height="100" rx="2" fill="url(#barGrad)"/>
      <rect x="88" y="30" width="14" height="80" rx="2" fill="url(#barGrad)"/>
      <rect x="110" y="55" width="14" height="55" rx="2" fill="url(#barGrad)"/>
      <rect x="132" y="25" width="14" height="85" rx="2" fill="url(#barGrad)"/>
      <rect x="154" y="15" width="14" height="95" rx="2" fill="url(#barGrad)"/>
      <rect x="176" y="45" width="14" height="65" rx="2" fill="url(#barGrad)"/>
      <rect x="198" y="35" width="14" height="75" rx="2" fill="url(#barGrad)"/>
      <rect x="220" y="60" width="14" height="50" rx="2" fill="url(#barGrad)"/>
      <rect x="242" y="70" width="14" height="40" rx="2" fill="url(#barGrad)"/>
      <rect x="264" y="25" width="14" height="85" rx="2" fill="url(#barGrad)"/>
      <rect x="286" y="18" width="14" height="92" rx="2" fill="url(#barGrad)"/>
      <rect x="308" y="40" width="14" height="70" rx="2" fill="url(#barGrad)"/>
      <rect x="330" y="50" width="14" height="60" rx="2" fill="url(#barGrad)"/>
      <rect x="352" y="20" width="14" height="90" rx="2" fill="url(#barGrad)"/>
      <rect x="374" y="30" width="14" height="80" rx="2" fill="url(#barGrad)"/>
      <rect x="396" y="65" width="14" height="45" rx="2" fill="url(#barGrad)"/>
      <rect x="418" y="45" width="14" height="65" rx="2" fill="url(#barGrad)"/>
      <rect x="440" y="35" width="14" height="75" rx="2" fill="url(#barGrad)"/>
      <rect x="462" y="15" width="14" height="95" rx="2" fill="url(#barGrad)"/>
      <rect x="484" y="25" width="14" height="85" rx="2" fill="url(#barGrad)"/>
      <rect x="506" y="55" width="14" height="55" rx="2" fill="url(#barGrad)"/>
      <rect x="528" y="70" width="14" height="40" rx="2" fill="url(#barGrad)"/>
      <rect x="550" y="45" width="14" height="65" rx="2" fill="url(#barGrad)"/>
      <rect x="572" y="30" width="14" height="80" rx="2" fill="url(#barGrad)"/>
      <rect x="594" y="60" width="14" height="50" rx="2" fill="url(#barGrad)"/>
    </g>
  </g>

  <!-- Player Control Deck -->
  <g transform="translate(60, 300)">
    <rect width="680" height="95" rx="4" fill="rgba(18,17,24,0.85)" stroke="rgba(255,255,255,0.08)"/>

    <!-- Track Info -->
    <rect x="20" y="18" width="55" height="55" rx="3" fill="#1e1b29" stroke="rgba(245,158,11,0.3)"/>
    <circle cx="47" cy="45" r="14" fill="#08070b"/>
    <circle cx="47" cy="45" r="4" fill="#f59e0b"/>

    <text x="90" y="40" font-family="'Space Mono', monospace" font-size="12" font-weight="bold" fill="#FAF9F6">Parth Mandore • Lossless Audio Engine</text>
    <text x="90" y="58" font-family="'Space Mono', monospace" font-size="10" fill="#6f6b7e">Replication Project • HTML5 Audio API • 24-Bit / 96kHz</text>

    <!-- Scrubber -->
    <text x="470" y="42" font-family="'Space Mono', monospace" font-size="9" fill="#f59e0b">02:48</text>
    <rect x="510" y="37" width="110" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
    <rect x="510" y="37" width="75" height="4" rx="2" fill="#f59e0b"/>
    <circle cx="585" cy="39" r="4" fill="#fff"/>
    <text x="630" y="42" font-family="'Space Mono', monospace" font-size="9" fill="#6f6b7e">04:12</text>
  </g>

  <!-- Bottom Status Bar -->
  <rect x="45" y="420" width="710" height="36" rx="2" fill="rgba(18,17,24,0.85)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
  <text x="65" y="442" font-family="'Space Mono', monospace" font-size="10" fill="#FAF9F6">INTERFACE ENGINE: <tspan fill="#f59e0b">Pixel-Perfect Spotify Web Player Replication • WebAudio Spectrum</tspan></text>

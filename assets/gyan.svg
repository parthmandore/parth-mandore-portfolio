<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0d14"/>
      <stop offset="100%" stop-color="#08070b"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <rect x="20" y="20" width="760" height="460" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="20" y1="65" x2="780" y2="65" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <text x="40" y="48" font-family="'Space Mono', monospace" font-size="11" fill="#A78BFA" letter-spacing="2">FIG. 03 // OFFLINE-FIRST ASSISTIVE DYSLEXIA LEARNING SYSTEM</text>
  <text x="590" y="48" font-family="'Space Mono', monospace" font-size="10" fill="#6f6b7e">TOP 25 NATIONAL IDEATHON 2025</text>

  <!-- Left: Mobile Terminal Frame -->
  <g transform="translate(50, 95)">
    <rect width="210" height="350" rx="20" fill="rgba(18,17,24,0.9)" stroke="rgba(167,139,250,0.4)" stroke-width="1.5"/>
    <!-- Speaker Notch -->
    <rect x="75" y="12" width="60" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
    
    <!-- Screen Viewport -->
    <rect x="15" y="30" width="180" height="290" rx="8" fill="#09080f" stroke="rgba(255,255,255,0.05)"/>
    <text x="25" y="55" font-family="'Space Mono', monospace" font-size="9" fill="#A78BFA">GYAN // LEARNING HUD</text>
    <line x1="25" y1="65" x2="185" y2="65" stroke="rgba(255,255,255,0.08)"/>

    <!-- Phoneme Visualizer Card -->
    <rect x="25" y="75" width="160" height="85" rx="6" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.25)"/>
    <text x="35" y="95" font-family="'Space Mono', monospace" font-size="8" fill="#6f6b7e">PHONEME MATCHING</text>
    <text x="35" y="125" font-family="'Syne', sans-serif" font-size="28" font-weight="bold" fill="#FAF9F6">b <tspan fill="#A78BFA">vs</tspan> d</text>
    <text x="35" y="145" font-family="'Space Mono', monospace" font-size="8" fill="#22D3EE">ACCURACY: 94.2%</text>

    <!-- Gamified Modules -->
    <rect x="25" y="170" width="160" height="40" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="35" y="195" font-family="'Space Mono', monospace" font-size="9" fill="#FAF9F6">Multisensory Audio Loop</text>
    
    <rect x="25" y="220" width="160" height="40" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="35" y="245" font-family="'Space Mono', monospace" font-size="9" fill="#FAF9F6">Handwriting Stroke Engine</text>

    <rect x="25" y="270" width="160" height="40" rx="4" fill="rgba(167,139,250,0.12)" stroke="#A78BFA"/>
    <text x="35" y="295" font-family="'Space Mono', monospace" font-size="9" fill="#A78BFA">Offline SQLite Local Sync</text>
  </g>

  <!-- Right: Architecture Pipeline -->
  <g transform="translate(290, 95)">
    <rect width="460" height="350" rx="6" fill="rgba(18,17,24,0.75)" stroke="rgba(255,255,255,0.08)"/>
    <text x="25" y="32" font-family="'Space Mono', monospace" font-size="11" fill="#6f6b7e">SYSTEM TOPOLOGY // OFFLINE RUNTIME</text>

    <!-- Block 1: React Native Client -->
    <rect x="25" y="55" width="195" height="70" rx="4" fill="rgba(167,139,250,0.06)" stroke="#A78BFA"/>
    <text x="40" y="80" font-family="'Space Mono', monospace" font-size="10" fill="#A78BFA">REACT NATIVE &amp; EXPO</text>
    <text x="40" y="98" font-family="'Space Mono', monospace" font-size="8" fill="#6f6b7e">Cross-Platform UI Engine</text>
    <text x="40" y="112" font-family="'Space Mono', monospace" font-size="8" fill="#22D3EE">Zero-Latency Touch Feedback</text>

    <!-- Connector -->
    <line x1="220" y1="90" x2="255" y2="90" stroke="#A78BFA" stroke-width="1.5"/>

    <!-- Block 2: Audio & Stroke AI -->
    <rect x="255" y="55" width="180" height="70" rx="4" fill="rgba(34,211,238,0.06)" stroke="#22D3EE"/>
    <text x="270" y="80" font-family="'Space Mono', monospace" font-size="10" fill="#22D3EE">PHONICS INFERENCE</text>
    <text x="270" y="98" font-family="'Space Mono', monospace" font-size="8" fill="#6f6b7e">Speech-to-Phoneme Rec</text>
    <text x="270" y="112" font-family="'Space Mono', monospace" font-size="8" fill="#FAF9F6">Multilingual Models</text>

    <!-- Vertical Connector -->
    <line x1="345" y1="125" x2="345" y2="160" stroke="#22D3EE" stroke-width="1.5"/>

    <!-- Block 3: SQLite Cache -->
    <rect x="255" y="160" width="180" height="70" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.15)"/>
    <text x="270" y="185" font-family="'Space Mono', monospace" font-size="10" fill="#FAF9F6">SQLITE EMBEDDED DB</text>
    <text x="270" y="203" font-family="'Space Mono', monospace" font-size="8" fill="#6f6b7e">Local Progress Cache</text>
    <text x="270" y="217" font-family="'Space Mono', monospace" font-size="8" fill="#A78BFA">100% Offline Capability</text>

    <!-- Connector Left -->
    <line x1="255" y1="195" x2="220" y2="195" stroke="#A78BFA" stroke-width="1.5"/>

    <!-- Block 4: Sync & Progress Analytics -->
    <rect x="25" y="160" width="195" height="70" rx="4" fill="rgba(167,139,250,0.08)" stroke="#A78BFA"/>
    <text x="40" y="185" font-family="'Space Mono', monospace" font-size="10" fill="#A78BFA">PROGRESS ANALYTICS</text>
    <text x="40" y="203" font-family="'Space Mono', monospace" font-size="8" fill="#6f6b7e">Error Pattern Tracking</text>
    <text x="40" y="217" font-family="'Space Mono', monospace" font-size="8" fill="#22D3EE">Adaptive Difficulty Adjustment</text>

    <!-- Terminal Console Log -->
    <rect x="25" y="250" width="410" height="80" rx="4" fill="#09080e" stroke="rgba(255,255,255,0.08)"/>
    <text x="40" y="272" font-family="'Space Mono', monospace" font-size="9" fill="#6f6b7e">$ gyan-core --status --mode=offline</text>
    <text x="40" y="292" font-family="'Space Mono', monospace" font-size="9" fill="#22c55e">✓ Offline SQLite storage: 12 student profiles synchronized</text>
    <text x="40" y="312" font-family="'Space Mono', monospace" font-size="9" fill="#A78BFA">★ National Ideathon 2025: Selected Top 25 Finalist</text>
  </g>
</svg>

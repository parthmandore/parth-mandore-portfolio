  <rect x="20" y="20" width="760" height="460" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="20" y1="65" x2="780" y2="65" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <text x="40" y="48" font-family="'Space Mono', monospace" font-size="11" fill="#f59e0b" letter-spacing="2">FIG. 04 // RANDOM FOREST BURNOUT RISK PREDICTION MODEL</text>
  <text x="610" y="48" font-family="'Space Mono', monospace" font-size="10" fill="#6f6b7e">R2: 0.892 • SCIKIT-LEARN</text>


    <rect x="20" y="125" width="225" height="16" rx="2" fill="#f59e0b"/>
    <text x="255" y="138" font-family="'Space Mono', monospace" font-size="10" fill="#f59e0b">0.29</text>

    <!-- Bar 3 -->

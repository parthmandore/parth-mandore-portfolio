    <rect x="20" y="175" width="140" height="16" rx="2" fill="#e2ded8"/>
    <text x="170" y="188" font-family="'Space Mono', monospace" font-size="10" fill="#e2ded8">0.18</text>

    <!-- Bar 4 -->
    <text x="20" y="215" font-family="'Space Mono', monospace" font-size="10" fill="#e2ded8">AEROBIC EXERCISE DAYS</text>
    <rect x="20" y="225" width="400" height="16" rx="2" fill="rgba(255,255,255,0.06)"/>
    <rect x="20" y="225" width="115" height="16" rx="2" fill="#e2ded8"/>
    <text x="145" y="238" font-family="'Space Mono', monospace" font-size="10" fill="#e2ded8">0.15</text>

    <text x="20" y="278" font-family="'Space Mono', monospace" font-size="9" fill="#6f6b7e">DATASET: Multi-variable biometric &amp; occupational survey telemetry</text>
  </g>

  <!-- Right: Prediction Outcome Gauge -->
  <g transform="translate(510, 95)">
    <rect width="245" height="300" rx="4" fill="rgba(18,17,24,0.75)" stroke="rgba(255,255,255,0.08)"/>

    <circle cx="122" cy="100" r="50" fill="none" stroke="#22c55e" stroke-width="8" stroke-dasharray="314" stroke-dashoffset="260"/>
    <text x="122" y="102" text-anchor="middle" font-family="'Space Mono', monospace" font-size="22" font-weight="bold" fill="#22c55e">14%</text>
    <text x="122" y="120" text-anchor="middle" font-family="'Space Mono', monospace" font-size="8" fill="#6f6b7e">BURNOUT PROBABILITY</text>

    <rect x="20" y="170" width="205" height="35" rx="3" fill="rgba(34,197,94,0.08)" stroke="rgba(34,197,94,0.3)"/>

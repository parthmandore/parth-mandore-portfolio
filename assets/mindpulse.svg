    <text x="30" y="255" font-family="'Space Mono', monospace" font-size="9" fill="#FAF9F6">MAE: 0.041 • MSE: 0.003</text>
    <text x="30" y="270" font-family="'Space Mono', monospace" font-size="8" fill="#f59e0b">ESTIMATORS: 100 TREES</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="45" y="420" width="710" height="36" rx="2" fill="rgba(18,17,24,0.85)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
  <text x="65" y="442" font-family="'Space Mono', monospace" font-size="10" fill="#FAF9F6">ACTIVE MODEL: <tspan fill="#f59e0b">RandomForestRegressor • Proactive Behavioral Wellness Telemetry</tspan></text>

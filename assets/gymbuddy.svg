<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0d14"/>
      <stop offset="100%" stop-color="#08070b"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <rect x="20" y="20" width="760" height="460" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="20" y1="65" x2="780" y2="65" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <text x="40" y="48" font-family="'Space Mono', monospace" font-size="11" fill="#f59e0b" letter-spacing="2">FIG. 02 // REAL-TIME COMPUTER VISION POSE ESTIMATION</text>
  <text x="640" y="48" font-family="'Space Mono', monospace" font-size="10" fill="#6f6b7e">LATENCY: 16ms • 60 FPS</text>

  <g transform="translate(240, 100)">
    <ellipse cx="80" cy="310" rx="140" ry="30" fill="none" stroke="rgba(245,158,11,0.15)" stroke-dasharray="4,4"/>

    <!-- Skeleton Bones -->
    <line x1="80" y1="60" x2="80" y2="160" stroke="#f59e0b" stroke-width="2.5" opacity="0.85"/>
    <line x1="30" y1="60" x2="130" y2="60" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="45" y1="160" x2="115" y2="160" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="30" y1="60" x2="0" y2="110" stroke="#e2ded8" stroke-width="2"/>
    <line x1="0" y1="110" x2="-15" y2="75" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="130" y1="60" x2="160" y2="110" stroke="#e2ded8" stroke-width="2"/>
    <line x1="160" y1="110" x2="175" y2="75" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="45" y1="160" x2="35" y2="230" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="35" y1="230" x2="30" y2="295" stroke="#e2ded8" stroke-width="2"/>
    <line x1="115" y1="160" x2="125" y2="230" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="125" y1="230" x2="130" y2="295" stroke="#e2ded8" stroke-width="2"/>

    <!-- Keypoint Nodes -->
    <circle cx="80" cy="30" r="14" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="80" cy="30" r="3" fill="#f59e0b"/>
    <circle cx="30" cy="60" r="4" fill="#fff"/>
    <circle cx="130" cy="60" r="4" fill="#fff"/>
    <circle cx="0" cy="110" r="4" fill="#f59e0b"/>
    <circle cx="160" cy="110" r="4" fill="#f59e0b"/>
    <circle cx="-15" cy="75" r="4" fill="#fff"/>
    <circle cx="175" cy="75" r="4" fill="#fff"/>
    <circle cx="45" cy="160" r="4" fill="#fff"/>
    <circle cx="115" cy="160" r="4" fill="#fff"/>
    <circle cx="35" cy="230" r="4" fill="#f59e0b"/>
    <circle cx="125" cy="230" r="4" fill="#f59e0b"/>
    <circle cx="30" cy="295" r="4" fill="#fff"/>
    <circle cx="130" cy="295" r="4" fill="#fff"/>
    <text x="-70" y="115" font-family="'Space Mono', monospace" font-size="9" fill="#f59e0b">88.4° [ROM]</text>
  </g>

  <!-- Left Telemetry Card -->
  <g transform="translate(45, 95)">
    <rect width="170" height="170" rx="4" fill="rgba(18,17,24,0.75)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="16" y="28" font-family="'Space Mono', monospace" font-size="10" fill="#6f6b7e">BIOMECHANIC HUD</text>
    <text x="16" y="60" font-family="'Space Mono', monospace" font-size="24" font-weight="bold" fill="#f59e0b">14 / 15</text>
    <text x="16" y="80" font-family="'Space Mono', monospace" font-size="9" fill="#e2ded8">REPETITION COUNT</text>
    <line x1="16" y1="95" x2="154" y2="95" stroke="rgba(255,255,255,0.08)"/>
    <text x="16" y="115" font-family="'Space Mono', monospace" font-size="9" fill="#6f6b7e">FORM ACCURACY</text>
    <text x="16" y="135" font-family="'Space Mono', monospace" font-size="15" font-weight="bold" fill="#22c55e">98.4% OPTIMAL</text>
    <text x="16" y="155" font-family="'Space Mono', monospace" font-size="8" fill="#f59e0b">• REAL-TIME POSE LOCK</text>
  </g>

  <!-- Right Architecture Card -->
  <g transform="translate(540, 95)">
    <rect width="215" height="270" rx="4" fill="rgba(18,17,24,0.75)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="16" y="28" font-family="'Space Mono', monospace" font-size="10" fill="#6f6b7e">INFERENCE PIPELINE</text>
    <rect x="16" y="45" width="183" height="35" rx="2" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.3)"/>
    <text x="26" y="66" font-family="'Space Mono', monospace" font-size="9" fill="#f59e0b">01. WEBCAM STREAM</text>
    <line x1="107" y1="80" x2="107" y2="95" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,2"/>
    <rect x="16" y="95" width="183" height="35" rx="2" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
    <text x="26" y="116" font-family="'Space Mono', monospace" font-size="9" fill="#e2ded8">02. POSENET KEYPOINTS</text>
    <line x1="107" y1="130" x2="107" y2="145" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,2"/>
    <rect x="16" y="145" width="183" height="35" rx="2" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)"/>
    <text x="26" y="166" font-family="'Space Mono', monospace" font-size="9" fill="#e2ded8">03. KINEMATIC ANGLES</text>
    <line x1="107" y1="180" x2="107" y2="195" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,2"/>
    <rect x="16" y="195" width="183" height="35" rx="2" fill="rgba(34,197,94,0.08)" stroke="rgba(34,197,94,0.3)"/>
    <text x="26" y="216" font-family="'Space Mono', monospace" font-size="9" fill="#22c55e">04. AUDIO COACHING</text>
    <text x="16" y="252" font-family="'Space Mono', monospace" font-size="8" fill="#6f6b7e">TENSORFLOW.JS • WEBAUDIO API</text>
  </g>

  <!-- Bottom Coaching Status Bar -->
  <rect x="45" y="420" width="710" height="36" rx="2" fill="rgba(18,17,24,0.85)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
  <circle cx="65" cy="438" r="4" fill="#22c55e"/>
  <text x="80" y="442" font-family="'Space Mono', monospace" font-size="10" fill="#FAF9F6">AUDIO COACHING: <tspan fill="#f59e0b">"Full extension detected — maintain steady tempo on rep 15."</tspan></text>
</svg>
  <!-- Bottom Bar -->
  <rect x="45" y="420" width="710" height="36" rx="2" fill="rgba(18,17,24,0.85)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
  <text x="65" y="442" font-family="'Space Mono', monospace" font-size="10" fill="#FAF9F6">ENGINE STATUS: <tspan fill="#f59e0b">Production Ready • Generative ATS Optimization Engine Active</tspan></text>

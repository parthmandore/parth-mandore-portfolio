    <text x="252" y="88" font-family="'Space Mono', monospace" font-size="8" fill="#6f6b7e">Dense Vector Mapping</text>

    <!-- Vertical Drop Connector -->
    <line x1="330" y1="100" x2="330" y2="135" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- Node 3 -->
    <rect x="240" y="135" width="180" height="50" rx="3" fill="rgba(245,158,11,0.08)" stroke="#f59e0b"/>
    <text x="252" y="157" font-family="'Space Mono', monospace" font-size="10" fill="#f59e0b">ATS SCORING ENGINE</text>
    <text x="252" y="173" font-family="'Space Mono', monospace" font-size="8" fill="#6f6b7e">Cosine Distance Match</text>

    <!-- Connector Left -->
    <line x1="240" y1="160" x2="200" y2="160" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- Node 4 -->
    <rect x="20" y="135" width="180" height="50" rx="3" fill="rgba(34,197,94,0.06)" stroke="#22c55e"/>
    <text x="32" y="157" font-family="'Space Mono', monospace" font-size="10" fill="#22c55e">INSIGHT SYNTHESIS</text>
    <text x="32" y="173" font-family="'Space Mono', monospace" font-size="8" fill="#6f6b7e">LLM Action Roadmaps</text>

    <!-- Terminal Diff Output -->
    <rect x="20" y="205" width="400" height="80" rx="3" fill="#0c0b10" stroke="rgba(255,255,255,0.08)"/>
    <text x="32" y="226" font-family="'Space Mono', monospace" font-size="9" fill="#6f6b7e">$ career-ai-eval --target "Backend Engineer"</text>
    <text x="32" y="246" font-family="'Space Mono', monospace" font-size="9" fill="#22c55e">✓ Identified 18 high-impact technical keywords</text>
    <text x="32" y="266" font-family="'Space Mono', monospace" font-size="9" fill="#f59e0b">• Recommendation: Expand distributed caching metrics</text>
  </g>

  <!-- Right: ATS Metric Gauges -->
  <g transform="translate(510, 95)">

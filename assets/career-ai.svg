    <rect x="20" y="195" width="186" height="8" rx="2" fill="#22c55e"/>

    <text x="20" y="225" font-family="'Space Mono', monospace" font-size="9" fill="#e2ded8">KEYWORD COVERAGE</text>
    <rect x="20" y="235" width="205" height="8" rx="2" fill="rgba(255,255,255,0.08)"/>
    <rect x="20" y="235" width="178" height="8" rx="2" fill="#f59e0b"/>

    <text x="20" y="265" font-family="'Space Mono', monospace" font-size="9" fill="#e2ded8">FORMAT COMPATIBILITY</text>
    <rect x="20" y="275" width="205" height="8" rx="2" fill="rgba(255,255,255,0.08)"/>

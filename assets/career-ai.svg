    <text x="122" y="103" text-anchor="middle" font-family="'Space Mono', monospace" font-size="22" font-weight="bold" fill="#fff">94.2%</text>
    <text x="122" y="120" text-anchor="middle" font-family="'Space Mono', monospace" font-size="8" fill="#f59e0b">ATS MATCH</text>

